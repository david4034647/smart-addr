
log4j.rootLogger = INFO,stdout,I,E

# 输出到控制台
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Threshold=INFO
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.Encoding=UTF-8
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss}[%t] %-3p %c %x - %m%n

### 输出 info 级别及以上日志到文件，限制单个文件 100MB，最多保留 10 个备份 ###
log4j.appender.I = org.apache.log4j.RollingFileAppender
log4j.appender.I.File = logs/info.log
log4j.appender.I.Append = true
log4j.appender.I.Threshold = INFO
log4j.appender.I.MaxFileSize = 100MB
log4j.appender.I.MaxBackupIndex = 10
log4j.appender.I.layout = org.apache.log4j.PatternLayout
log4j.appender.I.layout.ConversionPattern = %d{yyyy-MM-dd HH:mm:ss}[%t] %-3p %c %x - %m%n

### 输出 error 级别日志到独立文件 ###
log4j.appender.E = org.apache.log4j.RollingFileAppender
log4j.appender.E.File = logs/error.log
log4j.appender.E.Append = true
log4j.appender.E.Threshold = ERROR
log4j.appender.E.MaxFileSize = 50MB
log4j.appender.E.MaxBackupIndex = 5
log4j.appender.E.layout = org.apache.log4j.PatternLayout
log4j.appender.E.layout.ConversionPattern = %d{yyyy-MM-dd HH:mm:ss}[%t] %-3p %c %x - %m%n
